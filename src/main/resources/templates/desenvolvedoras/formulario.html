    <title>Cadastrar Desenvolvedora</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/gamehub.svg}">
</head>
<body>

<nav class="menu-topo">

<h1>Cadastrar Desenvolvedora</h1>

<form action="/desenvolvedoras" method="post">

    <input type="text" name="pais">
    <br><br>

    <button type="submit">Cadastrar</button>

</form>

<br>
<a href="/desenvolvedoras/listagem">
    Ver desenvolvedoras
</a>

</body>
</html>
