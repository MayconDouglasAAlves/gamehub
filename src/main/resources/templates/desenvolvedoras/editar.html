<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Editar Desenvolvedora</title>
</head>

<body>

<h1>Editar Desenvolvedora</h1>

<form
        th:action="@{/desenvolvedoras/editar/{id}(id=${desenvolvedora.id})}"
        method="post">

    <label>Nome:</label>

    <input
            type="text"
            name="nome"
            th:value="${desenvolvedora.nome}"
            required>

    <br><br>

    <label>País:</label>

    <input
            type="text"
            name="pais"
            th:value="${desenvolvedora.pais}"
            required>

    <br><br>

    <button type="submit">
        Salvar alterações
    </button>

</form>

<br>

<a href="/desenvolvedoras/listagem">
    Voltar para listagem
</a>

</body>
</html>
