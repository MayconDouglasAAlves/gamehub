<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Jogos</title>
</head>

<body>

<h1>Jogos cadastrados</h1>

<h2>Pesquisar jogo</h2>

<form action="/jogos/buscar" method="get">

    <input
            type="text"
            name="nome"
            placeholder="Digite o nome do jogo">

    <button type="submit">
        Pesquisar
    </button>

</form>

<br>

<a href="/jogos/formulario">
    Cadastrar novo jogo
</a>

<hr>

<div th:each="jogo : ${lista}">

    <p>
        <strong>ID:</strong>
        <span th:text="${jogo.id}"></span>
    </p>

    <p>
        <strong>Nome:</strong>
        <span th:text="${jogo.nome}"></span>
    </p>

    <p>
        <strong>Gênero:</strong>
        <span th:text="${jogo.genero}"></span>
    </p>

    <p>
        <strong>Ano:</strong>
        <span th:text="${jogo.ano}"></span>
    </p>

    <p>
        <strong>Preço:</strong>
        R$
        <span th:text="${jogo.preco}"></span>
    </p>

    <p>
        <strong>Desenvolvedora:</strong>
        <span th:text="${jogo.desenvolvedora.nome}"></span>
    </p>

    <a th:href="@{/jogos/editar/{id}(id=${jogo.id})}">
        Editar
    </a>

    &nbsp; | &nbsp;

    <a
            th:href="@{/jogos/excluir/{id}(id=${jogo.id})}"
            onclick="return confirm('Tem certeza que deseja excluir este jogo?');">

        Excluir

    </a>

    <hr>

</div>

</body>
</html>
